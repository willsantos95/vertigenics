version: '3.8'

services:
  vertigenics:
    build: .
    ports:
      - "8080:80"
    container_name: vertigenics-presell
    environment:
      - TZ=UTC
    volumes:
      - ./:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  nginx-data:
